<div class="registro-container">
  <div class="registro-card">
    <div class="registro-header">
      <a routerLink="/" class="btn-volver">← Volver al inicio</a>
      <span class="registro-badge">Registro</span>
    </div>

    <h2>Crear Cuenta</h2>
    <p class="subtexto-registro">
      Registra tu cuenta para acceder al sistema BioTech como paciente.
    </p>

    <form (ngSubmit)="registrar()">
      <label for="username">Usuario</label>
      <input
        type="text"
        id="username"
        name="username"
        [(ngModel)]="username"
        placeholder="Ingrese su usuario"
      />

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Ingrese su contraseña"
      />

      <button type="submit">Crear Cuenta</button>

      <p *ngIf="mensajeError" class="error">{{ mensajeError }}</p>
      <p *ngIf="mensajeExito" class="mensaje-exito">{{ mensajeExito }}</p>
    </form>

    <div class="registro-footer">
      <span>¿Ya tienes cuenta?</span>
      <a routerLink="/login">Iniciar sesión</a>
    </div>
  </div>
</div>
